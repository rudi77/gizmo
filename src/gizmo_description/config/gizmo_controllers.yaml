controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    paddle_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

paddle_position_controller:
  ros__parameters:
    joints:
      - paddle_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
